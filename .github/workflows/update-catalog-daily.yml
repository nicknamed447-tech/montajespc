name: Daily CPU and GPU catalog update

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update announced product catalog
        run: python3 scripts/update_catalog.py
      - name: Check recent CPU and GPU failure reports
        run: python3 scripts/update_review_alerts.py
      - name: Save catalog updates
        run: |
          if ! git diff --quiet -- catalog-updates.json review-alerts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog-updates.json review-alerts.json
            git commit -m "Update component catalog and review alerts"
            git push
          fi
